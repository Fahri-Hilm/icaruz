name: build-windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Build installer
        run: npx tauri build --bundles nsis
      - name: Portable zip
        run: Compress-Archive -Path target/release/icaruz.exe -DestinationPath target/release/bundle/ICARUZ-Portable.zip
      - name: Upload setup
        uses: actions/upload-artifact@v4
        with:
          name: ICARUZ-Setup
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/ICARUZ-Portable.zip
      - name: Release setup
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/ICARUZ-Portable.zip
          generate_release_notes: true
